<svg width="100%" viewBox="0 0 760 548" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>Pertussis SEIRS Compartmental Model with Partial-Immunity Track</title>
  <desc>Eight-compartment pertussis model. Naive track S->E->I->R and partially-immune track Sp->Ep->Ip->Rp. Vaccination moves S to Sp. Full natural immunity wanes R to Sp (omega1); partial recovered immunity wanes Rp to S (omega2); vaccine-derived protection wanes Sp to S (omega3). Force of infection is driven by both I and Ip (Ip scaled by sigma); partial susceptibles Sp are infected at reduced rate delta.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      text { font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif; }
      .th { font-size: 17px; font-weight: 700; }
      .ts { font-size: 12px; font-weight: 400; }
      .tl { font-size: 12px; font-weight: 400; fill: #5f5e5a; }
      .arr { stroke: #4a4a4a; stroke-width: 1.7; fill: none; }
      .c-blue rect  { fill: #E6F1FB; stroke: #185FA5; stroke-width: 1.4; }
      .c-blue .th   { fill: #0C447C; }
      .c-blue .ts   { fill: #185FA5; }
      .c-teal rect  { fill: #E1F5EE; stroke: #0F6E56; stroke-width: 1.4; }
      .c-teal .th   { fill: #085041; }
      .c-teal .ts   { fill: #0F6E56; }
      .arr-foi  { stroke: #C0392B; stroke-width: 1.8; fill: none; }
      .t-foi    { fill: #C0392B; font-size: 12px; }
      .arr-wane { stroke: #BA7517; stroke-width: 1.7; fill: none; stroke-dasharray: 5 3; }
      .t-wane   { fill: #BA7517; font-size: 12px; }
      .arr-vax  { stroke: #185FA5; stroke-width: 1.7; fill: none; stroke-dasharray: 4 3; }
      .t-vax    { fill: #185FA5; font-size: 12px; }
    </style>
  </defs>

  <rect x="0" y="0" width="760" height="548" fill="#ffffff"/>

  <!-- Title -->
  <text class="th" x="380" y="34" text-anchor="middle" style="fill:#1a1a18;">Pertussis — SEIRS with partial-immunity track</text>
  <text class="tl" x="380" y="55" text-anchor="middle">8 compartments · two-source force of infection β(I + σI&#8346;) · after Wearing &amp; Rohani (2009)</text>

  <!-- Row labels -->
  <text class="tl" x="20" y="149" text-anchor="middle" transform="rotate(-90,20,149)" style="font-weight:600;">NAIVE</text>
  <text class="tl" x="20" y="369" text-anchor="middle" transform="rotate(-90,20,369)" style="font-weight:600;">PARTIAL IMMUNITY</text>

  <!-- ============ NAIVE TRACK (top, y 120..178, center 149) ============ -->
  <g class="c-blue">
    <rect x="64" y="120" width="112" height="58" rx="9"/>
    <text class="th" x="120" y="145" text-anchor="middle" dominant-baseline="central">S</text>
    <text class="ts" x="120" y="164" text-anchor="middle" dominant-baseline="central">Susceptible</text>
  </g>
  <g class="c-blue">
    <rect x="224" y="120" width="112" height="58" rx="9"/>
    <text class="th" x="280" y="145" text-anchor="middle" dominant-baseline="central">E</text>
    <text class="ts" x="280" y="164" text-anchor="middle" dominant-baseline="central">Exposed</text>
  </g>
  <g class="c-blue">
    <rect x="384" y="120" width="112" height="58" rx="9"/>
    <text class="th" x="440" y="145" text-anchor="middle" dominant-baseline="central">I</text>
    <text class="ts" x="440" y="164" text-anchor="middle" dominant-baseline="central">Infectious</text>
  </g>
  <g class="c-blue">
    <rect x="544" y="120" width="112" height="58" rx="9"/>
    <text class="th" x="600" y="145" text-anchor="middle" dominant-baseline="central">R</text>
    <text class="ts" x="600" y="164" text-anchor="middle" dominant-baseline="central">Recovered</text>
  </g>

  <!-- ============ PARTIAL TRACK (bottom, y 340..398, center 369) ============ -->
  <g class="c-teal">
    <rect x="64" y="340" width="112" height="58" rx="9"/>
    <text class="th" x="120" y="365" text-anchor="middle" dominant-baseline="central">S&#8346;</text>
    <text class="ts" x="120" y="384" text-anchor="middle" dominant-baseline="central">Susceptible*</text>
  </g>
  <g class="c-teal">
    <rect x="224" y="340" width="112" height="58" rx="9"/>
    <text class="th" x="280" y="365" text-anchor="middle" dominant-baseline="central">E&#8346;</text>
    <text class="ts" x="280" y="384" text-anchor="middle" dominant-baseline="central">Exposed*</text>
  </g>
  <g class="c-teal">
    <rect x="384" y="340" width="112" height="58" rx="9"/>
    <text class="th" x="440" y="365" text-anchor="middle" dominant-baseline="central">I&#8346;</text>
    <text class="ts" x="440" y="384" text-anchor="middle" dominant-baseline="central">Infectious*</text>
  </g>
  <g class="c-teal">
    <rect x="544" y="340" width="112" height="58" rx="9"/>
    <text class="th" x="600" y="365" text-anchor="middle" dominant-baseline="central">R&#8346;</text>
    <text class="ts" x="600" y="384" text-anchor="middle" dominant-baseline="central">Recovered*</text>
  </g>

  <!-- ============ NAIVE HORIZONTAL ARROWS (y 149) ============ -->
  <line x1="176" y1="149" x2="222" y2="149" class="arr-foi" marker-end="url(#arrow)"/>
  <text class="t-foi" x="199" y="141" text-anchor="middle">β(I+σI&#8346;)</text>
  <line x1="336" y1="149" x2="382" y2="149" class="arr" marker-end="url(#arrow)"/>
  <text class="tl" x="359" y="141" text-anchor="middle">ε</text>
  <line x1="496" y1="149" x2="542" y2="149" class="arr" marker-end="url(#arrow)"/>
  <text class="tl" x="519" y="141" text-anchor="middle">γ</text>

  <!-- ============ PARTIAL HORIZONTAL ARROWS (y 369) ============ -->
  <line x1="176" y1="369" x2="222" y2="369" class="arr-foi" marker-end="url(#arrow)"/>
  <text class="t-foi" x="199" y="361" text-anchor="middle">δβ(I+σI&#8346;)</text>
  <line x1="336" y1="369" x2="382" y2="369" class="arr" marker-end="url(#arrow)"/>
  <text class="tl" x="359" y="361" text-anchor="middle">ε</text>
  <line x1="496" y1="369" x2="542" y2="369" class="arr" marker-end="url(#arrow)"/>
  <text class="tl" x="519" y="361" text-anchor="middle">γ&#8346;</text>

  <!-- ============ VACCINATION ν  S → Sp (down, left channel) ============ -->
  <line x1="102" y1="178" x2="102" y2="338" class="arr-vax" marker-end="url(#arrow)"/>
  <text class="t-vax" x="94" y="250" text-anchor="end">ν</text>
  <text class="t-vax" x="94" y="264" text-anchor="end" font-size="10">vaccination</text>

  <!-- ============ VACCINE WANING ω₃  Sp → S (up, right channel) ============ -->
  <line x1="140" y1="338" x2="140" y2="178" class="arr-wane" marker-end="url(#arrow)"/>
  <text class="t-wane" x="148" y="250" text-anchor="start">ω&#8323;</text>
  <text class="t-wane" x="148" y="264" text-anchor="start" font-size="10">vaccine waning</text>

  <!-- ============ WANING ω₁  R → Sp (full → partial) ============ -->
  <path d="M600 178 V244 H172 V338" class="arr-wane" marker-end="url(#arrow)"/>
  <text class="t-wane" x="392" y="238" text-anchor="middle">ω&#8321; · natural waning (full → partial)</text>

  <!-- ============ WANING ω₂  Rp → S (partial → susceptible), outer loop ============ -->
  <path d="M600 398 V486 H44 V150 H62" class="arr-wane" marker-end="url(#arrow)"/>
  <text class="t-wane" x="360" y="480" text-anchor="middle">ω&#8322; · waning (partial → fully susceptible)</text>

  <!-- ============ LEGEND ============ -->
  <text class="tl" x="380" y="518" text-anchor="middle" font-size="11">* Partial track: reduced susceptibility (δ&lt;1) and infectiousness (σ&lt;1); shorter, milder illness (γ&#8346; &gt; γ).</text>
  <text class="tl" x="380" y="536" text-anchor="middle" font-size="11">ν is dose-driven vaccination. Closed population — no births or deaths.</text>
</svg>
